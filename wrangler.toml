name = "mecara-web"
main = "src/worker.js"
compatibility_date = "2026-10-01"

routes = [
  { pattern = "mecara.app", custom_domain = true },
  { pattern = "www.mecara.app", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true
