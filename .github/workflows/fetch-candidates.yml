name: Preuzmi kandidate fotki
on:
  push:
    paths: ["build/candidates.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p build/candidates
          while read name url; do
            [ -z "$name" ] && continue
            curl -fsSL -A "Mozilla/5.0" -o "build/candidates/$name.jpg" "$url" && echo "ok $name $(stat -c%s build/candidates/$name.jpg)" || echo "FAIL $name"
          done < build/candidates.txt
          git config user.name "mecara-bot"; git config user.email "actions@github.com"
          git add build/candidates; git commit -m "Kandidati fotki (privremeno)" || true; git push
