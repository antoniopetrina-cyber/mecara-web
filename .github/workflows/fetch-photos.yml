name: Povuci fotke Mecare
on:
  push:
    paths: [".github/workflows/fetch-photos.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p public/img/foto
          base="https://unscriptedphotographers.com/_cf_images/variant=limit_1800,storage=cloudflare"
          while read id name; do
            curl -fsSL -A "Mozilla/5.0" -o "public/img/foto/$name.jpg" "$base/$id.jpg" && echo "ok $name" || echo "FAIL $name"
          done <<'LIST'
          6385433k2ck7t11ze9ckciish5a6 KKP4497
          a1twjggc17lig9klajkfrjzdjptv KKP4498
          8ilgo8svmwn65hhvwtosyi8s2joc KKP4503
          aq1esu1x1h4q63xcillqm0vnhttz KKP4506
          trgi0pa7p7ftdbopiwqt1cfdkxb6 KKP4512
          k68xb5s53l4f6pj4ni9a1174ixnj KKP4539
          3e1h9m0b2qv2rstwsnvdrfiv56sf KKP4545
          6uh7s3mrqc2gswiq3gl47rbb9m07 KKP4551
          q3rx57zdxb4k4qsy3x8w3k97knlm KKP4561
          jpeucvl2fmfn7auzo99arptyabc5 KKP4582
          xpnsng3k3mkv5zfyb6gmo88yikru KKP4591
          LIST
          sudo apt-get -qq install -y imagemagick >/dev/null || true
          for f in public/img/foto/*.jpg; do mogrify -resize '1600x1600>' -strip -quality 80 "$f"; done
          ls -la public/img/foto
      - name: Commit
        run: |
          git config user.name "mecara-bot"
          git config user.email "actions@github.com"
          git add public/img/foto
          git commit -m "Fotke Mecare (Princino)" || echo "nema promjena"
          git push
