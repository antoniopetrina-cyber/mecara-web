name: Provjeri mecara.app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.mecara.app
          echo "--- stranice"
          for p in / /komora/ /admin/ /blog/ /ponuda/; do curl -sS -o /dev/null -w "$p %{http_code} %{size_download}\n" "$B$p"; done
          echo "--- preusmjeravanja"
          for p in /komora/ /rostilj-planer/ /en/dry-age-room/ /en/bbq-planner/; do curl -sS -o /dev/null -w "$p %{http_code} %{redirect_url}\n" "$B$p"; done
          for p in /odlezani-steakovi/ /meso-za-rostilj/ /en/dry-aged-steaks/ /en/bbq-meat/; do curl -sS -o page.html -w "$p %{http_code} " "$B$p"; echo "planner=$(grep -c 'id=\"planner\"' page.html) uzivo=$(grep -c 'id=\"uzivo\"' page.html) bottomnav=$(grep -c 'bottom-nav' page.html)"; done
          echo "--- api"
          curl -sS "$B/api/live" | head -c 200; echo
          curl -sS -o /dev/null -w "live %{http_code}\n" "$B/api/live"
          curl -sS -w " admin/data %{http_code}\n" "$B/api/admin/data"
          curl -sS -w " enquiry bez zaglavlja %{http_code}\n" -X POST -H "content-type: application/json" -H "origin: $B" -d '{}' "$B/api/enquiry"
          curl -sS -w " login krivo %{http_code}\n" -X POST -H "content-type: application/json" -H "x-mecara: 1" -H "origin: $B" -d '{"email":"provjera@example.com","password":"krivo"}' "$B/api/admin/login"
          curl -sS -D - -o /dev/null "$B/admin/" | grep -iE "^(cache-control|x-robots|content-security)" 
